name: Release

# Publishes @valuz/genui-core and @valuz/a2ui to npm (private workspaces
# genui-server/genui-playground are skipped). Trigger by publishing a GitHub
# Release (or run manually). Requires an NPM_TOKEN repo secret with publish
# rights to the @valuz scope.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Build in dependency order (a2ui before core); pnpm runs recursive
      # scripts topologically.
      - run: pnpm -r build
      # Publish every non-private workspace package (core + a2ui); pnpm
      # replaces workspace:* with the resolved version and publishes in
      # dependency order.
      - run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
